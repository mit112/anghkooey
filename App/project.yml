name: Anghkooey
options:
  # CloudKit container (Lane C2 / ADR-0011): iCloud.com.mitsheth.anghkooey
  # Declared in App/Anghkooey/Anghkooey.entitlements; referenced by
  # AnghkooeyModelContainer.cloudKitContainerID. Provision in the Apple
  # Developer portal (CloudKit Dashboard) before archiving with sync enabled.
  bundleIdPrefix: com.mitsheth
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
  createIntermediateGroups: true
  # Re-applies PrivacyInfo.xcprivacy entries that xcodegen otherwise drops
  # from the generated pbxproj. See scripts/patch_privacy_info.py and #56.
  # NOTE: xcodegen runs postGenCommand with CWD = the directory containing
  # this project.yml (App/), hence the "../" — the script itself resolves
  # PBXPROJ relative to its own location, so this is CWD-independent otherwise.
  postGenCommand: python3 ../scripts/patch_privacy_info.py

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

packages:
  AnghkooeyCore:
    path: ../Packages/AnghkooeyCore
  AnghkooeyIntelligence:
    path: ../Packages/AnghkooeyIntelligence
  AnghkooeyUI:
    path: ../Packages/AnghkooeyUI

targets:
  Anghkooey:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: AnghkooeyUI
      - target: AnghkooeyShare
        embed: true
      - target: AnghkooeyWidget
        embed: true
    info:
      path: Anghkooey/Info.plist
      properties:
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleName: Anghkooey
        CFBundleDisplayName: Anghkooey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: Anghkooey uses the camera to capture text for automatic flashcard creation.
        LSSupportsOpeningDocumentsInPlace: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.ankimobile.apkg
            UTTypeConformsTo:
              - public.zip-archive
            UTTypeTagSpecification:
              public.filename-extension:
                - apkg
        CFBundleDocumentTypes:
          - CFBundleTypeName: Anki Package
            LSItemContentTypes:
              - com.ankimobile.apkg
            CFBundleTypeRole: Viewer
    sources:
      - path: Anghkooey
        excludes:
          - "**/*.xcprivacy"
    resources:
      # .xcprivacy is re-added by scripts/patch_privacy_info.py (run via make generate / postGenCommand); CI verifies it. See #56.
      - Anghkooey/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        # Ad-hoc signing so both app + appex get the same "-" cert on simulator CI.
        # Physical device builds override this via the Xcode UI / automatic signing.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Anghkooey/Anghkooey.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  AnghkooeyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: AnghkooeyCore
    sources:
      - path: AnghkooeyShare
        excludes:
          - "**/*.xcprivacy"
    resources:
      # .xcprivacy is re-added by scripts/patch_privacy_info.py (run via make generate / postGenCommand); CI verifies it. See #56.
      - AnghkooeyShare/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey.share
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: AnghkooeyShare/AnghkooeyShare-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Ad-hoc signing to match Anghkooey app target on simulator CI.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: AnghkooeyShare/AnghkooeyShare.entitlements

  AnghkooeyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: AnghkooeyCore
    sources:
      - path: AnghkooeyWidget
        excludes:
          - "**/*.xcprivacy"
    resources:
      # .xcprivacy is re-added by scripts/patch_privacy_info.py (run via make generate / postGenCommand); CI verifies it. See #56.
      - AnghkooeyWidget/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey.widget
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: AnghkooeyWidget/AnghkooeyWidget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: AnghkooeyWidget/AnghkooeyWidget.entitlements

  AnghkooeyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - target: Anghkooey
        embed: false
      # Core/Intelligence are provided at runtime by the host app above; do NOT
      # add them as package deps here. Linking them into the test bundle too
      # gives every Core/Intelligence Swift type two metadata copies (host dylib
      # + xctest), which the iOS 27 toolchain no longer dedupes — `as?`/`as`
      # downcasts then fail (nil engine, missed AuthoringError catch). `import`
      # / `@testable import` still resolve transitively via the host, exactly
      # like AnghkooeyUI (which is intentionally absent here for the same reason).
    sources:
      - path: AnghkooeyTests
    resources:
      - path: AnghkooeyTests/Fixtures
        type: copy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  AnghkooeyShare:
    build:
      targets:
        AnghkooeyShare: all
    run:
      config: Debug
    archive:
      config: Release

  AnghkooeyWidget:
    build:
      targets:
        AnghkooeyWidget: all
    run:
      config: Debug
    archive:
      config: Release

  Anghkooey:
    build:
      targets:
        Anghkooey: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnghkooeyTests
    profile:
      config: Release
    archive:
      config: Release
