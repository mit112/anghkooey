name: Anghkooey
options:
  # CloudKit container (Lane C2 / ADR-0011): iCloud.com.mitsheth.anghkooey
  # Declared in App/Anghkooey/Anghkooey.entitlements; referenced by
  # AnghkooeyModelContainer.cloudKitContainerID. Provision in the Apple
  # Developer portal (CloudKit Dashboard) before archiving with sync enabled.
  bundleIdPrefix: com.mitsheth
  deploymentTarget:
    iOS: "26.0"
  defaultConfig: Debug
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

packages:
  AnghkooeyCore:
    path: ../Packages/AnghkooeyCore
  AnghkooeyIntelligence:
    path: ../Packages/AnghkooeyIntelligence
  AnghkooeyUI:
    path: ../Packages/AnghkooeyUI

targets:
  Anghkooey:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: AnghkooeyUI
      - target: AnghkooeyShare
        embed: true
      - target: AnghkooeyWidget
        embed: true
    sources:
      - path: Anghkooey
        excludes:
          - "**/*.xcprivacy"
    resources:
      # WARNING — xcodegen fragility: xcodegen silently omits .xcprivacy from
      # PBXResourcesBuildPhase even when listed here. After every `make generate`
      # you MUST manually verify that PrivacyInfo.xcprivacy appears in the
      # PBXResourcesBuildPhase section of project.pbxproj. If it is missing,
      # re-add the PBXBuildFile entry and the reference in PBXResourcesBuildPhase.
      # Run: grep -c "PrivacyInfo" App/Anghkooey.xcodeproj/project.pbxproj
      # Expected count: 4 (PBXBuildFile, PBXFileReference, PBXGroup, PBXResourcesBuildPhase)
      # TODO: replace this manual step with a postGenCommand patch script.
      - Anghkooey/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: YES
        # Ad-hoc signing so both app + appex get the same "-" cert on simulator CI.
        # Physical device builds override this via the Xcode UI / automatic signing.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: Anghkooey/Anghkooey.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  AnghkooeyShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: AnghkooeyCore
    sources:
      - path: AnghkooeyShare
        excludes:
          - "**/*.xcprivacy"
    resources:
      # Same xcodegen fragility as main app: verify PrivacyInfo.xcprivacy appears in
      # PBXResourcesBuildPhase after every `make generate`.
      # Run: grep -c "AnghkooeyShare/PrivacyInfo" App/Anghkooey.xcodeproj/project.pbxproj
      # Expected count: 4 (PBXBuildFile, PBXFileReference, PBXGroup, PBXResourcesBuildPhase)
      - AnghkooeyShare/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey.share
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: AnghkooeyShare/AnghkooeyShare-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Ad-hoc signing to match Anghkooey app target on simulator CI.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: AnghkooeyShare/AnghkooeyShare.entitlements

  AnghkooeyWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - package: AnghkooeyCore
    sources:
      - path: AnghkooeyWidget
        excludes:
          - "**/*.xcprivacy"
    resources:
      # Same xcodegen fragility as main app: verify PrivacyInfo.xcprivacy appears in
      # PBXResourcesBuildPhase after every `make generate`.
      # Run: grep -c "AnghkooeyWidget/PrivacyInfo" App/Anghkooey.xcodeproj/project.pbxproj
      # Expected count: 4 (PBXBuildFile, PBXFileReference, PBXGroup, PBXResourcesBuildPhase)
      - AnghkooeyWidget/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey.widget
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        INFOPLIST_FILE: AnghkooeyWidget/AnghkooeyWidget-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_ENTITLEMENTS: AnghkooeyWidget/AnghkooeyWidget.entitlements

  AnghkooeyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    dependencies:
      - target: Anghkooey
        embed: false
      - package: AnghkooeyCore
      - package: AnghkooeyIntelligence
    sources:
      - path: AnghkooeyTests
    resources:
      - path: AnghkooeyTests/Fixtures
        type: copy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mitsheth.anghkooey.tests
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual

schemes:
  AnghkooeyShare:
    build:
      targets:
        AnghkooeyShare: all
    run:
      config: Debug
    archive:
      config: Release

  AnghkooeyWidget:
    build:
      targets:
        AnghkooeyWidget: all
    run:
      config: Debug
    archive:
      config: Release

  Anghkooey:
    build:
      targets:
        Anghkooey: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnghkooeyTests
    profile:
      config: Release
    archive:
      config: Release
